name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ProximityEffect-${{ runner.os }}
          path: |
            build/ProximityEffect_artefacts/Release/VST3
            build/ProximityEffect_artefacts/Release/AU
            build/ProximityEffect_artefacts/Release/Standalone
